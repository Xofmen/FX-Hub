<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Валюты">
<title>Конвертер валют</title>
<style>
:root{--bg:#0a0a0a;--card:#161616;--card2:#1f1f1f;--line:#2a2a2a;--tx:#f5f5f5;--mut:#8a8a8a;--or:#ff7a00;--or2:#ffb347;--glow:rgba(255,122,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;-webkit-user-select:none;user-select:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
.blob{position:fixed;width:340px;height:340px;border-radius:50%;filter:blur(90px);opacity:.28;z-index:0;pointer-events:none;background:var(--or);animation:float 14s ease-in-out infinite}
.b1{top:-120px;right:-100px}.b2{bottom:-140px;left:-120px;background:#ff4d00;animation-delay:-7s}
@keyframes float{50%{transform:translate(-40px,50px) scale(1.15)}}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:18px 16px 110px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;animation:down .6s both}
h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.5px}
h1 span{background:linear-gradient(90deg,var(--or),var(--or2));-webkit-background-clip:text;background-clip:text;color:transparent}
.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--or);display:grid;place-items:center;cursor:pointer;transition:.2s}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.spin svg{animation:spin .8s linear}
@keyframes spin{to{transform:rotate(360deg)}}
.status{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;margin:4px 2px 18px;animation:down .6s .1s both}
.dot{width:9px;height:9px;border-radius:50%;background:var(--or);box-shadow:0 0 0 0 var(--glow);animation:pulse 1.8s infinite}
.dot.off{background:#c0392b;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(255,122,0,0)}100%{box-shadow:0 0 0 0 rgba(255,122,0,0)}}
.bar{height:3px;background:var(--card);border-radius:3px;overflow:hidden;margin:-8px 0 16px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--or),var(--or2));transform-origin:left;transition:transform 1s linear}
@keyframes down{from{opacity:0;transform:translateY(-12px)}}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.97)}}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 12px 12px 14px;margin-bottom:10px;animation:up .45s both;transition:border-color .25s,box-shadow .25s,transform .25s}
.row.active{border-color:var(--or);box-shadow:0 0 0 1px var(--or),0 8px 28px var(--glow);transform:scale(1.015)}
.row.out{animation:out .3s forwards}
@keyframes out{to{opacity:0;transform:translateX(60px);height:0;padding:0;margin:0;border:0}}
.flag{width:44px;height:44px;border-radius:50%;flex:none;background:var(--card2) center/cover no-repeat;display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--or);border:2px solid var(--line);overflow:hidden}
.flag{position:relative}
.flag .emo{font-size:26px;line-height:1;font-weight:400}
.flag img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.info{min-width:0;flex:none;width:92px}
.code{font-weight:800;font-size:17px}
.name{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row input{-webkit-user-select:text;user-select:text;flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--tx);font-size:22px;font-weight:700;text-align:right;font-family:inherit}
.row input::placeholder{color:#444}
.row.active input{color:var(--or2)}
.row input.flash{animation:flash .5s}
@keyframes flash{30%{color:var(--or);text-shadow:0 0 14px var(--glow)}}
.del{width:28px;height:28px;border:0;border-radius:50%;background:var(--card2);color:var(--mut);cursor:pointer;flex:none;font-size:16px;line-height:1;transition:.2s}
.del:active{background:var(--or);color:#000;transform:scale(.85)}
.fab{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:8px;padding:15px 26px;border:0;border-radius:40px;background:linear-gradient(135deg,var(--or),#ff4d00);color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 10px 30px var(--glow);animation:up .7s .3s both;transition:transform .2s}
.fab:active{transform:translateX(-50%) scale(.94)}
.hint{text-align:center;color:var(--mut);font-size:12.5px;margin-top:14px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:10;opacity:0;pointer-events:none;transition:.3s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:520px;margin:0 auto;height:78vh;background:var(--card);border-radius:28px 28px 0 0;border-top:1px solid var(--or);transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{transform:none}
.grab{width:44px;height:5px;background:var(--line);border-radius:5px;margin:10px auto 6px}
.sheet h2{margin:6px 18px 10px;font-size:19px}
.search{margin:0 16px 10px;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:16px;outline:0;font-family:inherit}
.search:focus{border-color:var(--or)}
.list{overflow-y:auto;padding:0 10px 10px;flex:1;-webkit-overflow-scrolling:touch}
.item{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:14px;cursor:pointer;transition:background .15s}
.item:active{background:var(--card2)}
.item .flag{width:38px;height:38px}
.item .t{flex:1;min-width:0}
.item .t b{display:block}.item .t span{font-size:12px;color:var(--mut)}
.item .ck{color:var(--or);font-weight:800}
.empty{text-align:center;color:var(--mut);padding:30px}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="app">
  <header>
    <h1>Конвертер <span>валют</span></h1>
    <button class="icon-btn" id="refresh" aria-label="Обновить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
  </header>
  <div class="status"><span class="dot" id="dot"></span><span id="stat">Загрузка курсов…</span></div>
  <div class="bar"><i id="bar"></i></div>
  <div id="rows"></div>
  <div class="hint">Введите сумму в любом поле — остальные пересчитаются</div>
</div>
<button class="fab" id="add"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Добавить валюту</button>
<div class="overlay" id="ov"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div><h2>Все валюты</h2>
  <input class="search" id="q" placeholder="Поиск: USD, евро, dollar…" autocomplete="off">
  <div class="list" id="list"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const UPDATE_MS=60000;
const SRC=[
  async()=>{const r=await fetch('https://open.er-api.com/v6/latest/USD');const j=await r.json();if(j.result!=='success')throw 0;return j.rates},
  async()=>{const r=await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');const j=await r.json();const o={};for(const k in j.usd)o[k.toUpperCase()]=j.usd[k];return o}
];
const FLAG_FIX={EUR:'eu',XAF:'cm',XOF:'sn',XCD:'ag',XPF:'pf',ANG:'cw',CNH:'cn',GGP:'gg',IMP:'im',JEP:'je'};
const NOFLAG=/^(XAU|XAG|XPT|XPD|XDR|BTC|ETH)$/;
let dn;try{dn=new Intl.DisplayNames(['ru'],{type:'currency'})}catch(e){}
const cname=c=>{try{return dn?dn.of(c):c}catch(e){return c}};
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

let rates=load('rates',{}), updated=load('updated',0);
let list=load('list',['USD','EUR','RUB','UZS']);
let active=list[0], amount=1, countdown=60;

function flagEl(c){
  const d=document.createElement('div');d.className='flag';
  if(NOFLAG.test(c)){d.textContent=c.slice(0,3);return d}
  const cc=(FLAG_FIX[c]||c.slice(0,2)).toLowerCase();
  const emo=[...cc.toUpperCase()].map(ch=>String.fromCodePoint(127397+ch.charCodeAt(0))).join('');
  const em=document.createElement('span');em.className='emo';em.textContent=emo;d.appendChild(em);
  const urls=[
    'https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/1x1/'+cc+'.svg',
    'https://flagcdn.com/w80/'+cc+'.png',
    'https://flagsapi.com/'+cc.toUpperCase()+'/flat/64.png'
  ];
  let n=0;
  const img=new Image();img.alt='';
  img.onload=()=>{img.style.opacity=1};
  img.onerror=()=>{if(++n<urls.length)img.src=urls[n];else img.remove()};
  img.src=urls[0];
  d.appendChild(img);return d;
}
function convert(v,from,to){return v/rates[from]*rates[to]}
function fmt(n){
  if(!isFinite(n))return '';
  const a=Math.abs(n),d=a>=100?2:a>=1?4:6;
  return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:d}).format(n);
}
function parse(s){return parseFloat(String(s).replace(/\s/g,'').replace(',','.'))}

function render(){
  const box=$('#rows');box.innerHTML='';
  list.forEach((c,i)=>{
    const r=document.createElement('div');r.className='row'+(c===active?' active':'');r.dataset.c=c;
    r.style.animationDelay=i*60+'ms';
    r.appendChild(flagEl(c));
    const info=document.createElement('div');info.className='info';
    info.innerHTML='<div class="code">'+c+'</div><div class="name">'+cname(c)+'</div>';
    r.appendChild(info);
    const inp=document.createElement('input');inp.inputMode='decimal';inp.placeholder='0';inp.autocomplete='off';
    inp.addEventListener('focus',()=>{active=c;inp.select();document.querySelectorAll('.row').forEach(x=>x.classList.toggle('active',x===r))});
    inp.addEventListener('input',()=>{
      inp.value=inp.value.replace(/[^\d.,\s]/g,'');
      amount=parse(inp.value);active=c;fill(true);
    });
    r.appendChild(inp);
    const del=document.createElement('button');del.className='del';del.textContent='×';del.setAttribute('aria-label','Удалить');
    del.onclick=()=>{
      if(list.length<=2)return;
      r.classList.add('out');
      setTimeout(()=>{list=list.filter(x=>x!==c);if(active===c)active=list[0];save('list',list);render()},300);
    };
    r.appendChild(del);
    box.appendChild(r);
  });
  fill(false);
}
function fill(flash){
  document.querySelectorAll('.row').forEach(r=>{
    const c=r.dataset.c,inp=r.querySelector('input');
    if(c===active&&document.activeElement===inp)return;
    if(!rates[c]||!rates[active]||isNaN(amount)){inp.value='';return}
    const nv=fmt(c===active?amount:convert(amount,active,c));
    if(inp.value!==nv){inp.value=nv;if(flash){inp.classList.remove('flash');void inp.offsetWidth;inp.classList.add('flash')}}
  });
}

async function update(manual){
  const btn=$('#refresh');btn.classList.remove('spin');void btn.offsetWidth;btn.classList.add('spin');
  for(const s of SRC){
    try{
      const r=await s();
      if(r&&r.USD){rates=r;updated=Date.now();save('rates',rates);save('updated',updated);
        $('#dot').classList.remove('off');countdown=60;stat();
        if(!document.querySelector('.row'))render();else fill(true);
        if(!$('#sheet').classList.contains('show')===false)drawList();
        return}
    }catch(e){}
  }
  $('#dot').classList.add('off');
  $('#stat').textContent=updated?'Нет сети · курсы от '+new Date(updated).toLocaleTimeString('ru-RU'):'Нет сети и нет сохранённых курсов';
  if(!document.querySelector('.row'))render();
}
function stat(){
  if(!updated||$('#dot').classList.contains('off'))return;
  $('#stat').textContent='Онлайн · обновлено '+new Date(updated).toLocaleTimeString('ru-RU')+' · через '+countdown+' с';
}
setInterval(()=>{
  countdown--;
  $('#bar').style.transform='scaleX('+Math.max(countdown,0)/60+')';
  if(countdown<=0){countdown=60;update()}else stat();
},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-updated>UPDATE_MS)update()});
$('#refresh').onclick=()=>update(true);

/* добавление валют */
function drawList(){
  const q=$('#q').value.trim().toLowerCase(),box=$('#list');box.innerHTML='';
  const codes=Object.keys(rates).sort().filter(c=>!q||c.toLowerCase().includes(q)||cname(c).toLowerCase().includes(q));
  if(!codes.length){box.innerHTML='<div class="empty">Ничего не найдено</div>';return}
  codes.forEach(c=>{
    const it=document.createElement('div');it.className='item';
    it.appendChild(flagEl(c));
    const t=document.createElement('div');t.className='t';t.innerHTML='<b>'+c+'</b><span>'+cname(c)+'</span>';
    it.appendChild(t);
    const has=list.includes(c);
    if(has){const k=document.createElement('span');k.className='ck';k.textContent='✓';it.appendChild(k)}
    it.onclick=()=>{
      if(has){if(list.length>2){list=list.filter(x=>x!==c);if(active===c)active=list[0]}}
      else list.push(c);
      save('list',list);render();drawList();
    };
    box.appendChild(it);
  });
}
function openSheet(){$('#ov').classList.add('show');$('#sheet').classList.add('show');$('#q').value='';drawList()}
function closeSheet(){$('#ov').classList.remove('show');$('#sheet').classList.remove('show');$('#q').blur()}
$('#add').onclick=openSheet;$('#ov').onclick=closeSheet;$('#q').oninput=drawList;

render();update();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
